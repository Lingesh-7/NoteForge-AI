[project]
name = "noteforge-ai"
version = "0.1.0"
description = "Multi-agent app that turns a syllabus into exam-ready notes with a PDF export."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.55,<2",
    "langgraph>=1.1,<2",
    "langchain-core>=1.2,<2",
    "langchain-community>=0.4,<1",
    "langchain-openai>=1.0,<2",
    "langchain-huggingface>=1.2,<2",
    "langchain-text-splitters>=1.1,<2",
    "openai>=1.50,<3",
    "tavily-python>=0.7,<1",
    "faiss-cpu>=1.13,<2",
    "sentence-transformers>=5.3,<6",
    "torch>=2.10,<3",
    "pymupdf>=1.27,<2",
    "fpdf2>=2.8,<3",
    "python-dotenv>=1.0,<2",
]

# Streamlit Community Cloud installs from uv.lock. On Linux, take torch from the
# CPU-only index so the deploy doesn't download several GB of unused CUDA libraries.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
